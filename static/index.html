<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262b35;
    --text: #e6e8eb;
    --muted: #8b909c;
    --accent: #5b9dff;
    --accent-dim: #2a3f5c;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header {
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* Upload form */
  #uploadForm {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .file-input-label {
    flex: 1;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .file-input-label:hover {
    border-color: var(--accent);
  }
  .file-input-label.has-file {
    color: var(--text);
    border-style: solid;
    border-color: var(--accent-dim);
  }
  input[type="file"] {
    display: none;
  }
  button {
    background: var(--accent);
    color: #0b0d11;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled {
    background: var(--accent-dim);
    color: var(--muted);
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(1.08);
  }

  .status-line {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .status-line.visible { display: block; }
  .status-line.error { color: var(--danger); }
  .status-line.success { color: #6bd68b; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  .placeholder {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>RAG Chatbot</h1>
      <p>Upload documents, then ask questions grounded in exactly what's in them.</p>
    </header>

    <section class="panel">
      <h2>Upload a document</h2>
      <form id="uploadForm">
        <label class="file-input-label" id="fileLabel" for="fileInput">Choose a .pdf, .docx, .txt, or .md file...</label>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" />
        <button type="submit" id="uploadBtn" disabled>Upload</button>
      </form>
      <div class="status-line" id="uploadStatus"></div>
      <div class="hint">Uploading the exact same file twice reuses the existing copy instead of duplicating it.</div>
    </section>

    <section class="panel">
      <h2>Documents</h2>
      <div class="placeholder" id="documentsPlaceholder">Document list goes here (next commit).</div>
    </section>

    <section class="panel">
      <h2>Chat</h2>
      <div class="placeholder" id="chatPlaceholder">Chat interface goes here (upcoming commit).</div>
    </section>
  </div>

<script>
const fileInput = document.getElementById('fileInput');
const fileLabel = document.getElementById('fileLabel');
const uploadForm = document.getElementById('uploadForm');
const uploadBtn = document.getElementById('uploadBtn');
const uploadStatus = document.getElementById('uploadStatus');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    fileLabel.textContent = file.name;
    fileLabel.classList.add('has-file');
    uploadBtn.disabled = false;
  } else {
    fileLabel.textContent = 'Choose a .pdf, .docx, .txt, or .md file...';
    fileLabel.classList.remove('has-file');
    uploadBtn.disabled = true;
  }
});

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return;

  uploadBtn.disabled = true;
  uploadStatus.className = 'status-line visible';
  uploadStatus.textContent = 'Uploading...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/documents/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || 'Upload failed');
    }

    uploadStatus.className = 'status-line visible success';
    uploadStatus.textContent = `Uploaded "${data.doc_name}" - ${data.num_chunks} chunk(s) indexed.`;

    fileInput.value = '';
    fileLabel.textContent = 'Choose a .pdf, .docx, .txt, or .md file...';
    fileLabel.classList.remove('has-file');
  } catch (err) {
    uploadStatus.className = 'status-line visible error';
    uploadStatus.textContent = err.message;
  } finally {
    uploadBtn.disabled = true;
  }
});
</script>
</body>
</html>
