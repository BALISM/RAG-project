<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262b35;
    --text: #e6e8eb;
    --muted: #8b909c;
    --accent: #5b9dff;
    --accent-dim: #2a3f5c;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header {
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* Upload form */
  #uploadForm {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .file-input-label {
    flex: 1;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .file-input-label:hover {
    border-color: var(--accent);
  }
  .file-input-label.has-file {
    color: var(--text);
    border-style: solid;
    border-color: var(--accent-dim);
  }
  input[type="file"] {
    display: none;
  }
  button {
    background: var(--accent);
    color: #0b0d11;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled {
    background: var(--accent-dim);
    color: var(--muted);
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(1.08);
  }

  .status-line {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .status-line.visible { display: block; }
  .status-line.error { color: var(--danger); }
  .status-line.success { color: #6bd68b; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  .placeholder {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }

  .doc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-info { min-width: 0; }
  .doc-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .doc-delete {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 12px;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .doc-delete:hover:not(:disabled) {
    background: var(--danger);
    color: #0b0d11;
    filter: none;
  }

  #chatMessages {
    max-height: 420px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .msg {
    padding: 10px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg-role {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .msg.user .msg-role { color: var(--accent); }
  .msg.assistant .msg-role { color: #6bd68b; }
  .msg-content { white-space: pre-wrap; }
  .msg-pending { color: var(--muted); font-style: italic; }

  #chatForm {
    display: flex;
    gap: 8px;
  }
  #chatInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 13px;
  }
  #chatInput:focus {
    outline: none;
    border-color: var(--accent);
  }
  #chatInput:disabled { color: var(--muted); }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>RAG Chatbot</h1>
      <p>Upload documents, then ask questions grounded in exactly what's in them.</p>
    </header>

    <section class="panel">
      <h2>Upload a document</h2>
      <form id="uploadForm">
        <label class="file-input-label" id="fileLabel" for="fileInput">Choose a .pdf, .docx, .txt, or .md file...</label>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" />
        <button type="submit" id="uploadBtn" disabled>Upload</button>
      </form>
      <div class="status-line" id="uploadStatus"></div>
      <div class="hint">Uploading the exact same file twice reuses the existing copy instead of duplicating it.</div>
    </section>

    <section class="panel">
      <h2>Documents</h2>
      <div id="documentsList">
        <div class="placeholder" id="documentsPlaceholder">No documents uploaded yet.</div>
      </div>
    </section>

    <section class="panel">
      <h2>Chat</h2>
      <div id="chatMessages">
        <div class="placeholder" id="chatPlaceholder">Ask something about your uploaded documents.</div>
      </div>
      <form id="chatForm">
        <input type="text" id="chatInput" placeholder="Ask a question..." autocomplete="off" />
        <button type="submit" id="chatSendBtn">Ask</button>
      </form>
    </section>
  </div>

<script>
const fileInput = document.getElementById('fileInput');
const fileLabel = document.getElementById('fileLabel');
const uploadForm = document.getElementById('uploadForm');
const uploadBtn = document.getElementById('uploadBtn');
const uploadStatus = document.getElementById('uploadStatus');
const documentsList = document.getElementById('documentsList');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadDocuments() {
  const res = await fetch('/documents');
  const docs = await res.json();

  if (docs.length === 0) {
    documentsList.innerHTML = '<div class="placeholder">No documents uploaded yet.</div>';
    return;
  }

  documentsList.innerHTML = docs.map(doc => `
    <div class="doc-row" data-doc-id="${escapeHtml(doc.doc_id)}">
      <div class="doc-info">
        <div class="doc-name">${escapeHtml(doc.doc_name)}</div>
        <div class="doc-meta">${doc.num_chunks} chunk${doc.num_chunks === 1 ? '' : 's'}</div>
      </div>
      <button class="doc-delete" data-doc-id="${escapeHtml(doc.doc_id)}">Delete</button>
    </div>
  `).join('');

  documentsList.querySelectorAll('.doc-delete').forEach(btn => {
    btn.addEventListener('click', () => deleteDocument(btn.dataset.docId, btn));
  });
}

async function deleteDocument(docId, btnEl) {
  btnEl.disabled = true;
  btnEl.textContent = '...';
  try {
    const res = await fetch(`/documents/${docId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    await loadDocuments();
  } catch (err) {
    btnEl.disabled = false;
    btnEl.textContent = 'Delete';
    alert(`Failed to delete: ${err.message}`);
  }
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    fileLabel.textContent = file.name;
    fileLabel.classList.add('has-file');
    uploadBtn.disabled = false;
  } else {
    fileLabel.textContent = 'Choose a .pdf, .docx, .txt, or .md file...';
    fileLabel.classList.remove('has-file');
    uploadBtn.disabled = true;
  }
});

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return;

  uploadBtn.disabled = true;
  uploadStatus.className = 'status-line visible';
  uploadStatus.textContent = 'Uploading...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/documents/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || 'Upload failed');
    }

    uploadStatus.className = 'status-line visible success';
    uploadStatus.textContent = `Uploaded "${data.doc_name}" - ${data.num_chunks} chunk(s) indexed.`;

    fileInput.value = '';
    fileLabel.textContent = 'Choose a .pdf, .docx, .txt, or .md file...';
    fileLabel.classList.remove('has-file');

    await loadDocuments();
  } catch (err) {
    uploadStatus.className = 'status-line visible error';
    uploadStatus.textContent = err.message;
  } finally {
    uploadBtn.disabled = true;
  }
});

loadDocuments();

// --- Chat ---
const chatMessages = document.getElementById('chatMessages');
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');

let sessionId = null;   // set from the server's response after the first turn, reused for every turn after
let chatHistory = [];   // local render cache: [{role, content}]

function renderChat() {
  if (chatHistory.length === 0) {
    chatMessages.innerHTML = '<div class="placeholder">Ask something about your uploaded documents.</div>';
    return;
  }
  chatMessages.innerHTML = chatHistory.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-role">${m.role === 'user' ? 'You' : 'Assistant'}</div>
      <div class="msg-content ${m.pending ? 'msg-pending' : ''}">${escapeHtml(m.content)}</div>
    </div>
  `).join('');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = chatInput.value.trim();
  if (!question) return;

  chatInput.value = '';
  chatInput.disabled = true;
  chatSendBtn.disabled = true;

  chatHistory.push({ role: 'user', content: question });
  chatHistory.push({ role: 'assistant', content: 'Thinking...', pending: true });
  renderChat();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Chat request failed');

    sessionId = data.session_id;
    chatHistory[chatHistory.length - 1] = { role: 'assistant', content: data.answer };
  } catch (err) {
    chatHistory[chatHistory.length - 1] = { role: 'assistant', content: `Error: ${err.message}` };
  } finally {
    chatInput.disabled = false;
    chatSendBtn.disabled = false;
    chatInput.focus();
    renderChat();
  }
});
</script>
</body>
</html>
